tests:
  - name: trailers-present-and-well-formed
    policy: release-tag-trailers.hjson
    expect: PASS
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json

  - name: trailers-missing-tree-fails
    policy: release-tag-trailers.hjson
    expect: FAIL
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag-without-tree.json

  - name: unsigned-tag-is-not-a-release
    policy: release-tag-signed.hjson
    expect: FAIL
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json

  # The chained policies read the chain from their selectors and tenets,
  # which needs the engine's chain variable (AMPEL after v1.5.0; the floor is the first pre-release so a pseudo-version of main qualifies).
  - name: squash-evaluated-commit-passed
    policy: release-evaluated-commit-passed.hjson
    ampel-version: v1.5.1-0
    expect: PASS
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json
      - ../testdata/release/commit-x.json
      - ../testdata/release/results-pass.json

  - name: squash-evaluated-commit-failed
    policy: release-evaluated-commit-passed.hjson
    ampel-version: v1.5.1-0
    expect: FAIL
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json
      - ../testdata/release/commit-x.json
      - ../testdata/release/results-fail.json

  - name: squash-evaluated-commit-without-results-fails
    policy: release-evaluated-commit-passed.hjson
    ampel-version: v1.5.1-0
    expect: FAIL
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json
      - ../testdata/release/commit-x.json

  - name: merge-evaluated-commit-is-the-second-parent
    policy: release-evaluated-commit-passed.hjson
    ampel-version: v1.5.1-0
    expect: PASS
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag-merge.json
      - ../testdata/release/commit-y-merge.json
      - ../testdata/release/results-pass.json

  - name: tagged-commit-carries-named-tree
    policy: release-tagged-commit-tree.hjson
    ampel-version: v1.5.1-0
    expect: PASS
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json
      - ../testdata/release/commit-y-squash.json

  - name: tagged-commit-with-other-tree-fails
    policy: release-tagged-commit-tree.hjson
    ampel-version: v1.5.1-0
    expect: FAIL
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json
      - ../testdata/release/commit-y-squash-othertree.json

  - name: squash-evaluated-commit-carries-named-tree
    policy: release-evaluated-commit-tree.hjson
    ampel-version: v1.5.1-0
    expect: PASS
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json
      - ../testdata/release/commit-x.json

  - name: squash-evaluated-commit-with-other-tree-fails
    policy: release-evaluated-commit-tree.hjson
    ampel-version: v1.5.1-0
    expect: FAIL
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag.json
      - ../testdata/release/commit-x-othertree.json

  - name: merge-evaluated-commit-carries-named-tree
    policy: release-evaluated-commit-tree.hjson
    ampel-version: v1.5.1-0
    expect: PASS
    subject: "sha1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    attestations:
      - ../testdata/release/tag-merge.json
      - ../testdata/release/commit-y-merge.json
      - ../testdata/release/commit-x.json
